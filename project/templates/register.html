{% extends "layout.html" %}

{% block title %}
  Register
{% endblock %}

{% block body %}
<form action="/register" method="post" class="auth-form">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/login">Login</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>
  <h3><b>Register Page</b></h3>
  <div class="row mb-3">
    <label for="inputEmail3" class="col-sm-2 col-form-label" class="width">Username</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="inputEmail3" name="username" required>
    </div>
  </div>
  <div class="row mb-3">
    <label for="inputPassword3" class="col-sm-2 col-form-label">Password</label>
    <div class="col-sm-10">
      <input type="password" class="form-control" id="inputPassword3" name="password" required>
    </div>
  </div>
    <div class="row mb-3">
    <label for="inputPassword3" class="col-sm-2 col-form-label">Confirm</label>
    <div class="col-sm-10">
      <input type="password" class="form-control" name="confirm" id="inputPassword3" required>
    </div>
  </div>
  <div class="text-danger">
    {% if message %}
    {{ message }}
    {% endif %}
  </div>
  <fieldset class="row mb-3">
    <legend class="col-form-label col-sm-2 pt-0">Gender</legend>
    <div class="col-sm-10">
      <div class="form-check">
        <input class="form-check-input" type="radio" id="gridRadios1" value="Male" name="gender" checked>
        <label class="form-check-label" for="gridRadios1">
          Male
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" id="gridRadios2" name="gender" value="Female">
        <label class="form-check-label" for="gridRadios2">
          Female
        </label>
      </div>
    </div>
  </fieldset>
  <div class="row mb-3">
    <div class="col-sm-10 offset-sm-2">
      </div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
</form>
{% endblock %}
